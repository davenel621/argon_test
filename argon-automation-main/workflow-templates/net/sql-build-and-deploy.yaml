name: Run SQL Pipeline

on:
  push:
    branches:
      - main
      - 'users/**'
  workflow_dispatch:
    inputs:
      sqlVersion:
        description: 'SQL version to use'
        required: false
        type: string
        default: '2019'
      remoteUser:
        description: 'SSH username for the remote server'
        required: true
        type: string
      remotePath:
        description: 'Path on the remote server to deploy artifacts'
        required: true
        type: string
      webAppDirectory:
        description: 'Target directory on the remote server for the web app'
        required: true
        type: string

jobs:
  run-sql-pipeline:
    uses: ./.github/workflows/rw-sql-build-and-deploy.yaml
    with:
      sqlVersion: ${{ inputs.sqlVersion }}
      remoteUser: ${{ inputs.remoteUser }}
      remotePath: ${{ inputs.remotePath }}
      webAppDirectory: ${{ inputs.webAppDirectory }}
    secrets: inherit
