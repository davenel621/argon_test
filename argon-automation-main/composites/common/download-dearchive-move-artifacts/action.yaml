name: 'Download, De-archive And Move Artifacts'
description: 'Download, de-archive and move artifacts'

runs:
  using: "composite"
  steps:
    - name: Log - Downloading Build Artifact
      shell: pwsh
      run: |
        echo "🔄 Downloading build artifact"

    - name: Download Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        name: drop

    - name: Log - Downloaded Build Artifact
      shell: pwsh
      run: |
        echo "✅ Downloaded build artifact"

    - name: De-archive Artifacts
      shell: pwsh
      run: |
        echo "🔄 Processing artifacts"
        
        $foundAny = $false
        
        # Handle app.zip - keep it zipped for streamlined deployment
        if (Test-Path "app.zip") {
          Write-Host "📦 Found app.zip, keeping zipped for deployment"
          $foundAny = $true
        } else {
          Write-Host "⚠️ app.zip not found"
        }
        
        # Handle tests.zip - extract for test automation
        if (Test-Path "tests.zip") {
          Write-Host "📦 Found tests.zip, extracting for test automation..."
          New-Item -ItemType Directory -Path "tests" -Force | Out-Null
          Expand-Archive -Path "tests.zip" -DestinationPath "tests" -Force
          Write-Host "✅ Successfully extracted tests.zip"
          $foundAny = $true
        } else {
          Write-Host "⚠️ tests.zip not found"
        }
        
        if (-not $foundAny) {
          Write-Host "❌ No valid zip files found (app.zip or tests.zip)"
          Write-Host "📋 Available files/directories:"
          Get-ChildItem -Name | ForEach-Object { Write-Host "  - $_" }
          exit 1
        }

    - name: Clean Up Extracted Zip Files
      shell: pwsh
      run: |
        echo "🔄 Cleaning up extracted zip files"
        
        # Clean up only the tests.zip after extraction (keep app.zip for deployment)
        Remove-Item "tests.zip" -Force -ErrorAction SilentlyContinue
        
        Write-Host "✅ Artifacts processed successfully"
        Write-Host "📋 Final structure:"
        if (Test-Path "app.zip") {
          Write-Host "  � app.zip - Application deployment package (zipped)"
        }
        if (Test-Path "tests") {
          Write-Host "  📁 tests/ - Test artifacts (extracted for automation)"
        }