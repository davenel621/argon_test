name: 'SQL Deploy Composite Action'
description: 'A SQL composite action for deploying SQL applications, running tests, and post-deploy checks.'

inputs:
  sshPrivateKey:
    description: 'The SSH private key'
    required: true
  remoteUser:
    description: 'SSH username for the remote server'
    required: true
  remoteHost:
    description: 'Remote host address'
    required: true
  remotePath:
    description: 'Path on the remote server to deploy artifacts'
    required: true
  webAppDirectory:
    description: 'Target directory on the remote server for the web app'
    required: true
  sqlVersion:
    description: 'SQL version to use on remote server'
    required: false
    default: '2019'
  startScript:
    description: 'Script to start the SQL application (if applicable)'
    required: false
    default: 'start'

runs:
  using: "composite"
  steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        name: drop

    # Need to add SSH authentication step here

    - name: Copy, De-archive, and Move Artifacts via SSH
      uses: ./composites/common/copy-dearchive-move-artifacts
      with:
        remoteUser: ${{ inputs.remoteUser }}
        remoteHost: ${{ inputs.remoteHost }}
        remotePath: ${{ inputs.remotePath }}
        webAppDirectory: ${{ inputs.webAppDirectory }}

    - name: Wait for SQL Server to be Live
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
      run: |
        $maxAttempts = 30
        $attempt = 0
        $success = $false
        while ($attempt -lt $maxAttempts -and -not $success) {
          $result = ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "sqlcmd -S localhost -Q 'SELECT 1'"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SQL Server is live."
            $success = $true
          } else {
            Write-Host "Waiting for SQL Server to be live... ($($attempt+1)/$maxAttempts)"
            Start-Sleep -Seconds 1
            $attempt++
          }
        }
        if (-not $success) {
          Write-Error "SQL Server did not become live in time."
          exit 1
        }

    - name: Run Smoke Tests on Remote SQL App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && if (Test-Path './test/smoke') { ./test/smoke/run.ps1 } else { echo 'No smoke tests found' }"

    - name: Run Integration Tests on Remote SQL App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && if (Test-Path './test/integration') { ./test/integration/run.ps1 } else { echo 'No integration tests found' }"
