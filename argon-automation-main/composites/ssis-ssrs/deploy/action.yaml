name: 'SSIS/SSRS Deploy Composite Action'
description: 'A composite action for SSIS/SSRS deploy operations'

inputs:
  sshPrivateKey:
    description: 'The SSH private key'
    required: true
  remoteUser:
    description: 'SSH username for the remote server'
    required: true
  remoteHost:
    description: 'Remote host address'
    required: true
  remotePath:
    description: 'Path on the remote server to deploy artifacts'
    required: true
  webAppDirectory:
    description: 'Target directory on the remote server for the web app'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        name: drop

    # CLAY - TO REFACTOR
    # - Authenticate to the deployment targets via SSH
    # - name: Authenticate via SSH
    #   shell: pwsh
    #   run: |

    - name: Copy, De-archive, and Move Artifacts via SSH
      uses: ./composites/common/copy-dearchive-move-artifacts
      with:
        remoteUser: ${{ inputs.remoteUser }}
        remoteHost: ${{ inputs.remoteHost }}
        remotePath: ${{ inputs.remotePath }}
        webAppDirectory: ${{ inputs.webAppDirectory }}

    - name: Restart SSIS/SSRS Services
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Stop-Service -Name \"SQL Server Integration Services*\" -Force -ErrorAction SilentlyContinue'"
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Stop-Service -Name \"SQL Server Reporting Services*\" -Force -ErrorAction SilentlyContinue'"
        
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Start-Sleep -Seconds 5'"
        
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Start-Service -Name \"SQL Server Integration Services*\"'"
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Start-Service -Name \"SQL Server Reporting Services*\"'"
        
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Get-Service -Name \"SQL Server Integration Services*\" | Format-Table -AutoSize'"
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "powershell -Command 'Get-Service -Name \"SQL Server Reporting Services*\" | Format-Table -AutoSize'"

    - name: Run SSIS/SSRS Smoke Tests Using SSISUnit
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && SSISUnit.exe /testSuite:SmokeTests.ssisunit"

    # We only want to run these on higher environments
    # CLAY will touch this
    - name: Run SSIS/SSRS Smoke Tests Using SSISUnit
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && SSISUnit.exe /testSuite:IntegrationTests.ssisunit"

# CLAY
# Assuming that this is a PROD deployment,
# We would do tagging
# This would be the same conditional as the Integration tests
# Use the SemVer tagging composite action