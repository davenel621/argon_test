name: 'Node.js Deploy Composite Action'
description: 'A Node.js composite action for deploy operations with NPM/Yarn support'

inputs:
  sshPrivateKey:
    description: 'The SSH private key'
    required: true
  remoteUser:
    description: 'SSH username for the remote server'
    required: true
  remoteHost:
    description: 'Remote host address'
    required: true
  remotePath:
    description: 'Path on the remote server to deploy artifacts'
    required: true
  webAppDirectory:
    description: 'Target directory on the remote server for the web app'
    required: true
  packageManager:
    description: 'Package manager to use (npm or yarn)'
    required: false
    default: 'npm'
  nodeVersion:
    description: 'Node.js version to use on remote server'
    required: false
    default: '18'
  startScript:
    description: 'NPM script name to start the application'
    required: false
    default: 'start'

runs:
  using: "composite"
  steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        name: drop

    # CLAY - NEEDS SSH AUTHENTICATE

    - name: Copy, De-archive, and Move Artifacts via SSH
      uses: ./composites/common/copy-dearchive-move-artifacts
      with:
        remoteUser: ${{ inputs.remoteUser }}
        remoteHost: ${{ inputs.remoteHost }}
        remotePath: ${{ inputs.remotePath }}
        webAppDirectory: ${{ inputs.webAppDirectory }}

    - name: Install Node.js Dependencies
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
        PACKAGE_MANAGER: ${{ inputs.packageManager }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && $env:PACKAGE_MANAGER install --production"

    - name: Stop Existing Node.js Application
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "pkill -f 'node.*$env:WEB_APP_DIRECTORY' || true"
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "pm2 stop all || true"

    - name: Start Node.js Application
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
        PACKAGE_MANAGER: ${{ inputs.packageManager }}
        START_SCRIPT: ${{ inputs.startScript }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && nohup $env:PACKAGE_MANAGER run $env:START_SCRIPT > app.log 2>&1 &"

    - name: Wait For Application To Start
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "
          for i in {1..30}; do
            if pgrep -f 'node.*$env:WEB_APP_DIRECTORY' > /dev/null; then
              sleep 2
              if pgrep -f 'node.*$env:WEB_APP_DIRECTORY' > /dev/null; then
                echo 'Application process is running and stable'
                exit 0
              fi
            fi
            echo 'Waiting for application process...'
            sleep 1
          done
          echo 'Application process may not have started properly'
        "

    - name: Run Smoke Tests On Remote Node.js App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
        PACKAGE_MANAGER: ${{ inputs.packageManager }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && $env:PACKAGE_MANAGER run test:smoke || echo 'No smoke tests found'"

    - name: Run Integration Tests On Remote Node.js App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
        PACKAGE_MANAGER: ${{ inputs.packageManager }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && $env:PACKAGE_MANAGER run test:integration || echo 'No integration tests found'"
