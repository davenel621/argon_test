name: Run .NET Pipeline

on:
  push:
    branches:
      - main
      - 'users/**'
  workflow_dispatch:
    inputs:
      dotnetVersion:
        description: '.NET SDK version to use'
        required: false
        type: string
        default: '8.0.x'
      buildConfiguration:
        description: 'Build configuration (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      # projectPath:
      #   description: 'Path to the .NET project/solution file'
      #   required: false
      #   type: string
      #   default: './src/MyApp.csproj'
      # publishRuntime:
      #   description: 'Target runtime identifier'
      #   required: false
      #   type: string
      #   default: 'linux-x64'
      # remoteUser:
      #   description: 'SSH username for deployment'
      #   required: false
      #   type: string
      #   default: 'appuser'
      # remotePath:
      #   description: 'Remote deployment staging path'
      #   required: false
      #   type: string
      #   default: '/tmp/deploy'
      # webAppDirectory:
      #   description: 'Final application directory on remote server'
      #   required: false
      #   type: string
      #   default: '/opt/myapp'
      # appExecutableName:
      #   description: 'Name of the .NET executable'
      #   required: false
      #   type: string
      #   default: 'MyApp'
      # appPort:
      #   description: 'Application port number'
      #   required: false
      #   type: string
      #   default: '5000'
      # useSystemd:
      #   description: 'Use systemd service management'
      #   required: false
      #   type: boolean
      #   default: true
      # serviceName:
      #   description: 'Systemd service name prefix'
      #   required: false
      #   type: string
      #   default: 'dotnet-app'

permissions:
  contents: read
  actions: write
  security-events: read
  checks: write
  pull-requests: read
  pages: write
  deployments: write

jobs:        
  run-dotnet-pipeline:
    uses: ./.github/workflows/rw-dotnet-build-and-deploy.yaml
    with:
      dotnetVersion: ${{ inputs.dotnetVersion }}
      buildConfiguration: ${{ inputs.buildConfiguration }}
      # projectPath: ${{ inputs.projectPath }}
      # publishRuntime: ${{ inputs.publishRuntime }}
      # remoteUser: ${{ inputs.remoteUser }}
      # remotePath: ${{ inputs.remotePath }}
      # webAppDirectory: ${{ inputs.webAppDirectory }}
      # appExecutableName: ${{ inputs.appExecutableName }}
      # appPort: ${{ inputs.appPort }}
      # useSystemd: ${{ inputs.useSystemd }}
      # serviceName: ${{ inputs.serviceName }}
    secrets: inherit