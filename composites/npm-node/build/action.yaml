name: 'NPM Node Build And Scan Composite Action'
description: 'A Node.js composite action for build and scan operations with NPM/Yarn support'

inputs:
  nodeVersion:
    description: 'What version of Node.js to use'
    required: true
  packageManager:
    description: 'Package manager to use (npm or yarn)'
    required: false
    default: 'npm'
  buildScript:
    description: 'NPM/Yarn script to run for building (e.g., build, compile)'
    required: false
    default: 'build'
  testScript:
    description: 'NPM/Yarn script to run for testing (e.g., test, test:unit)'
    required: false
    default: 'test'
  SSC_URL:
    description: 'Fortify Software Security Center URL'
    required: true
  SSC_TOKEN:
    description: 'Fortify Software Security Center authentication token'
    required: true
  SC_SAST_CLIENT_AUTH_TOKEN:
    description: 'Fortify ScanCentral SAST client authentication token'
    required: true
  DEBRICKED_TOKEN:
    description: 'Debricked authentication token for dependency scanning'
    required: true
  SONAR_TOKEN:
    description: 'SonarQube authentication token'
    required: true
  SONAR_HOST_URL:
    description: 'SonarQube server URL'
    required: true


runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.nodeVersion }}
        architecture: 'x64'
        cache: ${{ inputs.packageManager }}
        cache-dependency-path: ./${{ github.event.repository.name }}/${{ inputs.packageManager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

    - name: Create Build Directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "./${{ github.event.repository.name }}"

    - name: Install Dependencies
      shell: pwsh
      working-directory: ./${{ github.event.repository.name }}
      run: |
        if ("${{ inputs.packageManager }}" -eq "yarn") {
          yarn install --frozen-lockfile
        } else {
          npm ci
        }

    - name: Build Node.js Application
      shell: pwsh
      working-directory: ./${{ github.event.repository.name }}
      run: |
        if ("${{ inputs.packageManager }}" -eq "yarn") {
          yarn run ${{ inputs.buildScript }}
        } else {
          npm run ${{ inputs.buildScript }}
        }
        if (Test-Path "./dist") {
          Copy-Item -Path "./dist/*" -Destination "../build" -Recurse -Force
        } elseif (Test-Path "./build") {
          Copy-Item -Path "./build/*" -Destination "../build" -Recurse -Force
        } else {
          Write-Host "No standard build output directory found (dist or build)"
        }

    # Run unit tests - ensure that if the unit tests fail, the workflow fails
    - name: Run Node.js Unit Tests
      shell: pwsh
      working-directory: ./build
      continue-on-error: false
      run: |
        if ("${{ inputs.packageManager }}" -eq "yarn") {
          yarn run ${{ inputs.testScript }}
        } else {
          npm run ${{ inputs.testScript }}
        }

    - name: Run Security Scans
      uses: ./composites/common/security-scans
      with:
        SSC_URL: ${{ inputs.SSC_URL }}
        SSC_TOKEN: ${{ inputs.SSC_TOKEN }}
        SC_SAST_CLIENT_AUTH_TOKEN: ${{ inputs.SC_SAST_CLIENT_AUTH_TOKEN }}
        DEBRICKED_TOKEN: ${{ inputs.DEBRICKED_TOKEN }}
        SONAR_TOKEN: ${{ inputs.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}

    - name: Stage, Archive, And Publish Artifacts
      uses: ./composites/common/stage-archive-publish