name: '.NET Build And Scan Composite Action'
description: 'A .NET composite action for build and scan operations'

inputs:
  dotnetVersion:
    description: 'What version of .NET to use (e.g., 6.0.x, 7.0.x, 8.0.x, 9.0.x)'
    required: false
    default: '9.0.x'

