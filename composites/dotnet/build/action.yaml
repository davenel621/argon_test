    - name: Restore .NET Dependencies
      working-directory: ${{ github.workspace }}/${{ github.event.repository.name }}
      shell: pwsh
      run: |
        echo "🔄 Restoring .NET Dependencies"
        # Use dotnet restore without specifying files - it will auto-discover
        # This works with solution files, project files, or any valid .NET structure
        dotnet restore
        echo "✅ Restored .NET Dependencies"

    - name: Build .NET Application
      working-directory: ${{ github.workspace }}/${{ github.event.repository.name }}
      shell: pwsh
      run: |
        echo "🔄 Building .NET Application (Release configuration ONLY)"
        echo "📋 Note: All builds are enforced to use Release configuration for production readiness"
        # Use dotnet build without specifying files - it will auto-discover
        # This works with solution files, project files, or any valid .NET structure
        # Hard-coded to Release configuration for consistency across all builds
        dotnet build src/**/*.csproj --configuration Release --no-restore -o "drop/app"
        echo "✅ Built .NET Application in Release mode"

    - name: Run .NET Unit Tests
      uses: ./automation/composites/dotnet/test
      with:
        workingDirectory: ${{ github.workspace }}/${{ github.event.repository.name }}
        testType: Unit

