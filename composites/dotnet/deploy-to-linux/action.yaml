name: '.NET Deploy to Linux Composite Action'
description: 'A .NET composite action for deploy operations to Linux'

inputs:
  dotnetVersion:
    description: 'What version of .NET to use (e.g., 6.0.x, 7.0.x, 8.0.x, 9.0.x)'
    required: false
    default: '9.0.x'
  environment:
    description: 'Environment name (dev, test, staging, prod)'
    required: false
    default: 'Production'
  privateKey:
    description: 'SSH private key for deployment'
    required: true
  targetUsername:
    description: 'Target server username for SSH connection'
    required: true
  targetIp:
    description: 'Target server IP address for SSH connection'
    required: true

runs:
  using: "composite"
  steps:
    - name: Log - Installing .NET SDK
      shell: bash
      run: |
        echo "🔄 Installing .NET SDK (version: ${{ inputs.dotnetVersion }})"

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: ${{ inputs.dotnetVersion }}
        source-url: https://api.nuget.org/v3/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Log - Completed .NET SDK Installation
      shell: bash
      run: |
        echo "✅ Completed .NET SDK installation successfully"
        dotnet --version

    - name: Setup SSH Key
      if: inputs.environment == 'dev' # only deploy to dev for now
      uses: ./automation/composites/common/setup-ssh
      with:
        privateKey: ${{ inputs.privateKey }}
        targetUsername: ${{ inputs.targetUsername }}
        targetIp: ${{ inputs.targetIp }}

    - name: Download, De-archive and Move Artifacts
      uses: ./automation/composites/common/download-dearchive-move-artifacts

    - name: Run .NET Mock Tests
      if: inputs.environment == 'dev'
      uses: ./automation/composites/dotnet/test
      with:
        workingDirectory: ${{ github.workspace }}/tests
        runAgainstBuildArtifact: 'true'
        testType: Mock

    - name: Install NET SDK on ${{ inputs.environment }} Target
      if: inputs.environment == 'dev' # only deploy to dev for now
      shell: bash
      env:
        TARGET_USERNAME: ${{ inputs.targetUsername }}
        TARGET_IP: ${{ inputs.targetIp }}
        DOTNET_VERSION: ${{ inputs.dotnetVersion }}
      run: |
        echo "🔄 Installing .NET SDK (version: $DOTNET_VERSION) on target server"
        
        privateKeyPath="$HOME/.ssh/private_key.pem"
        requiredVersion="$DOTNET_VERSION"
        requiredMajorVersion="${requiredVersion%%.*}"
        
        # Check current .NET version and determine if installation is needed
        dotnetVersion=$(ssh -o StrictHostKeyChecking=no -i "$privateKeyPath" "$TARGET_USERNAME@$TARGET_IP" "export PATH=\$PATH:\$HOME/.dotnet && dotnet --version 2>/dev/null || echo 'not-installed'")
        
        needsInstallation=false
        if [ "$dotnetVersion" = "not-installed" ]; then
            needsInstallation=true
            echo "No .NET installation found"
        elif [ "${dotnetVersion%%.*}" -lt "$requiredMajorVersion" ] 2>/dev/null; then
            needsInstallation=true
            echo "Current .NET version $dotnetVersion is lower than required $requiredMajorVersion"
        else
            echo ".NET version $dotnetVersion meets requirements (required: $requiredMajorVersion)"
        fi
        
        if [ "$needsInstallation" = true ]; then
            echo "Installing .NET SDK version $requiredVersion to user directory..."
            
            # Determine if we should use --channel or --version parameter
            if [[ "$requiredVersion" =~ \.x$ ]]; then
                # For patterns like 9.0.x, use channel parameter
                channel="${requiredVersion%.x}"
                installParam="--channel $channel"
            else
                # For specific versions, use version parameter
                installParam="--version $requiredVersion"
            fi
            
            # Use Microsoft's official installation script for specific version to user directory
            installScript="
        # Create .dotnet directory in user home
        mkdir -p ~/.dotnet
        
        # Download and install .NET SDK to user directory
        curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin $installParam --install-dir ~/.dotnet
        
        # Add to PATH in .bashrc if not already there
        if ! grep -q 'export PATH=.*\.dotnet' ~/.bashrc; then
            echo 'export PATH=\$PATH:\$HOME/.dotnet' >> ~/.bashrc
        fi
        
        # Add to PATH for current session
        export PATH=\$PATH:\$HOME/.dotnet
        
        # Verify installation
        ~/.dotnet/dotnet --version
        "
            
            ssh -o StrictHostKeyChecking=no -i "$privateKeyPath" "$TARGET_USERNAME@$TARGET_IP" "$installScript"
            
            # Verify the installation worked - use the full path to ensure we get the new version
            verifyVersion=$(ssh -o StrictHostKeyChecking=no -i "$privateKeyPath" "$TARGET_USERNAME@$TARGET_IP" "~/.dotnet/dotnet --version 2>/dev/null || echo 'verification-failed'")
            if [ "$verifyVersion" = "verification-failed" ]; then
                echo "❌ .NET installation verification failed"
                exit 1
            else
                echo "✅ .NET SDK $verifyVersion installed successfully"
            fi
        fi
        
        echo "✅ .NET SDK installation on target server completed"

    - name: Transfer Application to ${{ inputs.environment }} Target
      if: inputs.environment == 'dev' # only deploy to dev for now
      shell: bash
      env:
        TARGET_USERNAME: ${{ inputs.targetUsername }}
        TARGET_IP: ${{ inputs.targetIp }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "🔄 Transferring Application to Target Server"
        
        privateKeyPath="$HOME/.ssh/private_key.pem"
        
        # Check if we have app.zip (new format) or app directory (legacy format)
        if [ -f "$WORKSPACE/app.zip" ]; then
            echo "📦 Found app.zip, transferring to target..."
            
            # Transfer the zip file
            scp -o StrictHostKeyChecking=no -i "$privateKeyPath" "$WORKSPACE/app.zip" "$TARGET_USERNAME@$TARGET_IP:~/app.zip"
            if [ $? -ne 0 ]; then
                echo "❌ Failed to transfer app.zip"
                exit 1
            fi
            
        elif [ -d "$WORKSPACE/app" ]; then
            echo "📁 Found app directory (legacy format), transferring contents..."
            
            # Create remote directory
            ssh -o StrictHostKeyChecking=no -i "$privateKeyPath" "$TARGET_USERNAME@$TARGET_IP" "mkdir -p ~/app"
            if [ $? -ne 0 ]; then
                echo "❌ Failed to create remote directory"
                exit 1
            fi
            
            # Use SCP to transfer files (transfer the entire app directory contents)
            scp -o StrictHostKeyChecking=no -i "$privateKeyPath" -r "$WORKSPACE/app/." "$TARGET_USERNAME@$TARGET_IP:~/app/"
            if [ $? -ne 0 ]; then
                echo "❌ Failed to transfer application files"
                exit 1
            fi
            
        else
            echo "❌ No application package found (neither app.zip nor app directory)"
            echo "📋 Available files:"
            ls -1 "$WORKSPACE" | while read -r file; do
                echo "  - $file"
            done
            exit 1
        fi
        
        echo "✅ Application transfer completed"

