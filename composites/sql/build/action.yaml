name: 'SQL Build, Scan, Test, and Deploy Composite Action'
description: 'A composite action for building, scanning, testing, and deploying SQL applications.'

inputs:
  SSC_URL:
    description: 'Fortify Software Security Center URL'
    required: true
  SSC_TOKEN:
    description: 'Fortify Software Security Center authentication token'
    required: true
  SC_SAST_CLIENT_AUTH_TOKEN:
    description: 'Fortify ScanCentral SAST client authentication token'
    required: true
  DEBRICKED_TOKEN:
    description: 'Debricked authentication token for dependency scanning'
    required: true
  SONAR_TOKEN:
    description: 'SonarQube authentication token'
    required: true
  SONAR_HOST_URL:
    description: 'SonarQube server URL'
    required: true
  SSH_PRIVATE_KEY:
    description: 'SSH private key for deployment'
    required: true
  REMOTE_HOST:
    description: 'Remote host for deployment'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup SQL Environment
      shell: pwsh
      run: |
        Write-Host "Setting up SQL environment for version ${{ inputs.sqlVersion }}"
        # Add setup steps for SQL tools if needed

    - name: Install Dependencies
      shell: pwsh
      run: |
        if (Test-Path "./requirements.txt") {
          Write-Host "Installing Python dependencies..."
          pip install -r requirements.txt
        } else {
          Write-Host "No dependencies to install."
        }

    - name: Build SQL Application
      shell: pwsh
      run: |
        Write-Host "Building SQL application for version ${{ inputs.sqlVersion }}"
        $buildDir = "./${{ github.event.repository.name }}"
        if (!(Test-Path $buildDir)) {
          New-Item -ItemType Directory -Force -Path $buildDir
        }
        if (Test-Path "./sql") {
          Copy-Item -Path "./sql/*" -Destination $buildDir -Recurse -Force
          Write-Host "Copied SQL scripts to build directory"
        }
        if (Test-Path "./migrations") {
          Copy-Item -Path "./migrations/*" -Destination "$buildDir/migrations" -Recurse -Force
          Write-Host "Copied migration scripts to build directory"
        }
        $sqlFiles = Get-ChildItem -Path $buildDir -Filter "*.sql" -Recurse
        if ($sqlFiles.Count -gt 0) {
          Write-Host "Found $($sqlFiles.Count) SQL files"
          # Add SQL syntax validation here if needed
        }
        Write-Host "SQL application build completed"

    - name: Run SQL Unit Tests
      shell: pwsh
      run: |
        if (Test-Path "./test" -or Test-Path "./tests") {
          Write-Host "Running SQL unit tests..."
          # Add your SQL unit test runner here
        } else {
          Write-Host "No unit tests directory found."
        }

    - name: Run Security Scans
      uses: ./composites/common/security-scans
      with:
        SSC_URL: ${{ inputs.SSC_URL }}
        SSC_TOKEN: ${{ inputs.SSC_TOKEN }}
        SC_SAST_CLIENT_AUTH_TOKEN: ${{ inputs.SC_SAST_CLIENT_AUTH_TOKEN }}
        DEBRICKED_TOKEN: ${{ inputs.DEBRICKED_TOKEN }}
        SONAR_TOKEN: ${{ inputs.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}

    - name: Stage, Archive, and Publish Artifacts
      uses: ./composites/common/stage-archive-publish
      with:
        buildDirectory: ${{ github.event.repository.name }}