name: 'Java Deploy Composite Action'
description: 'A composite action for Java deploy operations'

inputs:
  sshPrivateKey:
    description: 'The SSH private key'
    required: true
  remoteUser:
    description: 'SSH username for the remote server'
    required: true
  remoteHost:
    description: 'Remote host address'
    required: true
  remotePath:
    description: 'Path on the remote server to deploy artifacts'
    required: true
  webAppDirectory:
    description: 'Target directory on the remote server for the web app'
    required: true
  artifactJarName:
    description: 'Name of the Java artifact (JAR file) to run'
    required: true

runs:
  using: "composite"
  steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4.3.0
      with:
        name: drop

    # CLAY - TO REFACTOR
    # - Authenticate to the deployment targets via SSH
    # - name: Authenticate via SSH
    #   shell: pwsh
    #   run: |

    - name: Copy, De-archive, and Move Artifacts via SSH
      uses: ./composites/common/copy-dearchive-move-artifacts
      with:
        remoteUser: ${{ inputs.remoteUser }}
        remoteHost: ${{ inputs.remoteHost }}
        remotePath: ${{ inputs.remotePath }}
        webAppDirectory: ${{ inputs.webAppDirectory }}

    - name: Restart Java Application
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
        ARTIFACT_JAR_NAME: ${{ inputs.artifactJarName }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "pkill -f '$env:ARTIFACT_JAR_NAME' || true"
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "nohup java -jar '$env:WEB_APP_DIRECTORY/$env:ARTIFACT_JAR_NAME' > '$env:WEB_APP_DIRECTORY/app.log' 2>&1 &"

    - name: Run Smoke Tests On Remote Java App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && ./gradlew smokeTest"

    # We only want to run these on higher environments
    # CLAY will touch this
    - name: Run Integration Tests On Remote Java App
      shell: pwsh
      env:
        REMOTE_USER: ${{ inputs.remoteUser }}
        REMOTE_HOST: ${{ inputs.remoteHost }}
        WEB_APP_DIRECTORY: ${{ inputs.webAppDirectory }}
      run: |
        ssh "$env:REMOTE_USER@$env:REMOTE_HOST" "cd '$env:WEB_APP_DIRECTORY' && ./gradlew integrationTest"

# CLAY
# Assuming that this is a PROD deployment,
# We would do tagging
# This would be the same conditional as the Integration tests
# Use the SemVer tagging composite action