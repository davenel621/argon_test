name: 'Java Build And Scan Composite Action'
description: 'A composite action for Java build and scan operations'

inputs:
  jdkVersion:
    description: 'What version of Java to use'
    required: true
  javaDistribution:
    description: 'Which Java distribution to use'
    required: true
  SSC_URL:
    description: 'Fortify Software Security Center URL'
    required: true
  SSC_TOKEN:
    description: 'Fortify Software Security Center authentication token'
    required: true
  SC_SAST_CLIENT_AUTH_TOKEN:
    description: 'Fortify ScanCentral SAST client authentication token'
    required: true
  DEBRICKED_TOKEN:
    description: 'Debricked authentication token for dependency scanning'
    required: true
  SONAR_TOKEN:
    description: 'SonarQube authentication token'
    required: true
  SONAR_HOST_URL:
    description: 'SonarQube server URL'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Java Tools
      uses: actions/setup-java@v4.7
      with:
        java-version: ${{ inputs.jdkVersion }}
        distribution: ${{ inputs.javaDistribution }}
        architecture: 'x64'
        cache: 'gradle'

    - name: Create Build Directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "./build"

    - name: Build Java Application Via Gradle
      working-directory: ./${{ github.event.repository.name }}
      shell: pwsh
      run: |
        ./gradlew build --no-daemon
        Copy-Item -Path "./build/*" -Destination "../build" -Recurse -Force

    # Do we need to publish these unit tests someplace?
    # This will depend on what testing framework they use
    # Ensure that if the unit tests fail, the workflow fails
    - name: Run Java Unit Tests
      shell: pwsh
      working-directory: ./build
      continue-on-error: false
      run: |
        ./gradlew test --no-daemon

    - name: Run Security Scans
      uses: ./composites/common/security-scans
      with:
        SSC_URL: ${{ inputs.SSC_URL }}
        SSC_TOKEN: ${{ inputs.SSC_TOKEN }}
        SC_SAST_CLIENT_AUTH_TOKEN: ${{ inputs.SC_SAST_CLIENT_AUTH_TOKEN }}
        DEBRICKED_TOKEN: ${{ inputs.DEBRICKED_TOKEN }}
        SONAR_TOKEN: ${{ inputs.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}

    - name: Stage, Archive, and Publish Artifacts
      uses: ./composites/common/stage-archive-publish