name: 'Required Workflow: Check Environment Protection Rules'

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  merge_group:

jobs:
  check-environment-protection:
    name: 'Validate Environment Protection Rules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Environment Protection Rules
        id: check-rules
        uses: ava-client-ussouth-scg-argon/argon-automation/composites/common/check-environment-protection@main
        with:
          github-token: ${{ github.token }}
          environment: 'prod'
          required-team: 'Argon-ADM'
          organization: ${{ github.repository_owner }}