name: Build and Deploy Node.js

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      nodeVersion:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '18'
      packageManager:
        description: 'Package manager to use (npm or yarn)'
        required: false
        type: string
        default: 'npm'
      buildScript:
        description: 'NPM script name to build the application'
        required: false
        type: string
        default: 'build'
      startScript:
        description: 'NPM script name to start the application'
        required: false
        type: string
        default: 'start'
      remoteUser:
        description: 'SSH username for the remote server'
        required: true
        type: string
      remotePath:
        description: 'Path on the remote server to deploy artifacts'
        required: true
        type: string
      webAppDirectory:
        description: 'Target directory on the remote server for the web app'
        required: true
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Run Build and Scan
        uses: ./composites/npm-node/build
        with:
          nodeVersion: ${{ inputs.nodeVersion }}
          packageManager: ${{ inputs.packageManager }}
          buildScript: ${{ inputs.buildScript }}
          SSC_URL: ${{ secrets.SSC_URL }}
          SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          SC_SAST_CLIENT_AUTH_TOKEN: ${{ secrets.SC_SAST_CLIENT_AUTH_TOKEN }}
          DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy-to-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Run Deploy Against Dev
        uses: ./composites/npm-node/deploy
        with:
          sshPrivateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          remoteUser: ${{ inputs.remoteUser }}
          remoteHost: ${{ secrets.REMOTE_HOST }}
          remotePath: ${{ inputs.remotePath }}
          webAppDirectory: ${{ inputs.webAppDirectory }}
          packageManager: ${{ inputs.packageManager }}
          nodeVersion: ${{ inputs.nodeVersion }}
          startScript: ${{ inputs.startScript }}

  deploy-to-test:
    name: Deploy to Test
    runs-on: ubuntu-latest
    needs: deploy-to-dev
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Run Deploy Against Test
        uses: ./composites/npm-node/deploy
        with:
          sshPrivateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          remoteUser: ${{ inputs.remoteUser }}
          remoteHost: ${{ secrets.REMOTE_HOST }}
          remotePath: ${{ inputs.remotePath }}
          webAppDirectory: ${{ inputs.webAppDirectory }}
          packageManager: ${{ inputs.packageManager }}
          nodeVersion: ${{ inputs.nodeVersion }}
          startScript: ${{ inputs.startScript }}

  deploy-to-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: deploy-to-test
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Run Deploy Against Prod
        uses: ./composites/npm-node/deploy
        with:
          sshPrivateKey: ${{ secrets.SSH_PRIVATE_KEY }}
          remoteUser: ${{ inputs.remoteUser }}
          remoteHost: ${{ secrets.REMOTE_HOST }}
          remotePath: ${{ inputs.remotePath }}
          webAppDirectory: ${{ inputs.webAppDirectory }}
          packageManager: ${{ inputs.packageManager }}
          nodeVersion: ${{ inputs.nodeVersion }}
          startScript: ${{ inputs.startScript }}